controllers:
  resource:
    path: ../src/Controller/
    namespace: App\Controller
  type: attribute

login_check:
  path: /login/check

2fa_login:
  path: /login/2fa
  defaults:
    # "scheb_two_factor.form_controller" references the controller service provided by the bundle.
    # You don't HAVE to use it, but - except you have very special requirements - it is recommended.
    _controller: "scheb_two_factor.form_controller::form"

2fa_login_check:
  path: /login/2fa/check

logout:
  path: /logout

app.swagger_ui:
  path: /docs/api
  methods: GET
  defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

composer:
    resource: '@ComposerDependencyListBundle/Controller'
    type: attribute
    prefix: /dependencies

oauth2:
  resource: '@LeagueOAuth2ServerBundle/config/routes.php'
  type: php
  prefix: /oauth2

ajgarlag_openid_connect_provider:
  resource: '@AjgarlagOpenIDConnectProviderBundle/config/routes.php'
  type: php
  prefix: /oidc

oidc_discovery:
  path: /.well-known/openid-configuration
  defaults:
    _controller: "ajgarlag.openid_connect_provider.controller.discovery::__invoke"